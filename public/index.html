<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2358D1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="description" content="AI-навігатор по магазину Сільпо на офіційному MCP: 3D-схема залу, маршрут до товару та Цінотижики по дорозі.">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/css/silpo.css">
  <title>Сільпо Навігатор — маршрут до товару</title>
  <style>
    :root {
      --blue: #2358D1;
      --blue-dark: #1B47AA;
      --blue-soft: #EAF0FD;
      --red: #DA291C;
      --yellow: #FBBB5E;
      --yellow-soft: #FFE2AD;
      --orange: #FE8522;
      --green: #07B324;
      --ink: #202124;
      --muted: #6E7480;
      --bg: #F2F4F9;
      --card: #FFFFFF;
      --border: #DEDFE0;
      --radius: 16px;
      --safe-b: env(safe-area-inset-bottom, 0px);
      --safe-t: env(safe-area-inset-top, 0px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; overscroll-behavior: none; }
    body {
      font-family: 'Silpo Text', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg); color: var(--ink); display: flex; flex-direction: column;
    }
    button, input { font-family: inherit; }
    .hidden { display: none !important; }

    .side { display: flex; flex-direction: column; min-height: 0; }
    header {
      background: var(--card); border-bottom: 1px solid var(--border);
      padding: calc(10px + var(--safe-t)) 14px 10px; display: flex; align-items: center; gap: 8px;
    }
    .logo { font-weight: 800; font-size: 17px; letter-spacing: -0.4px; }
    .logo span { color: var(--red); }
    .chip {
      display: inline-flex; align-items: center; gap: 6px; border: 0;
      padding: 7px 12px; border-radius: 999px; font-size: 12px; font-weight: 700; white-space: nowrap;
    }
    .chip.bonus { background: var(--yellow-soft); color: #7A5416; }
    .chip.cart { background: var(--blue); color: #fff; margin-left: auto; }
    .chip.cart:active { background: var(--blue-dark); }
    .icon-btn {
      background: var(--bg); border: 1px solid var(--border); color: var(--muted);
      width: 34px; height: 34px; border-radius: 999px; font-size: 15px; display: grid; place-items: center;
    }

    .searchbar { background: var(--card); padding: 0 14px 12px; border-bottom: 1px solid var(--border); }
    .field { position: relative; }
    .field .si {
      position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
      color: var(--muted); font-size: 17px; pointer-events: none;
    }
    .field input {
      width: 100%; border: 1px solid var(--border); border-radius: 14px; padding: 13px 14px 13px 42px;
      font-size: 16px; background: var(--bg); color: var(--ink);
    }
    .field input:focus { outline: none; border-color: var(--blue); background: #fff; }
    .storechip {
      display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 12px;
      color: var(--muted); background: var(--bg); padding: 9px 12px; border-radius: 14px;
    }
    .storechip .si { color: var(--red); font-size: 15px; }
    .storechip strong { color: var(--ink); }
    .storechip button { margin-left: auto; background: var(--blue); color: #fff; border: 0; border-radius: 999px; padding: 6px 12px; font-size: 11px; font-weight: 700; }

    main { flex: 1; position: relative; min-height: 0; }
    canvas#map { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
    .map-hint {
      position: absolute; left: 12px; top: 12px; background: rgba(255,255,255,.95);
      border: 1px solid var(--border); border-radius: 14px; padding: 9px 12px;
      font-size: 12px; color: var(--muted); max-width: 60%; line-height: 1.4;
    }
    .zoom { position: absolute; right: 12px; top: 12px; display: flex; flex-direction: column; gap: 8px; }
    .zoom button {
      width: 40px; height: 40px; border-radius: 14px; border: 1px solid var(--border);
      background: #fff; color: var(--ink); font-size: 16px; display: grid; place-items: center;
    }
    .zoom button:active { background: var(--blue-soft); }
    .mcp-badge {
      position: absolute; left: 12px; bottom: 56px; background: var(--ink); color: #fff;
      border-radius: 999px; padding: 7px 12px; font-size: 11px; font-weight: 600; opacity: .92;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .dept-strip {
      position: absolute; left: 12px; right: 64px; bottom: 12px;
      display: flex; gap: 6px; overflow-x: auto; -webkit-overflow-scrolling: touch;
      padding-bottom: 2px; scrollbar-width: none;
    }
    .dept-strip::-webkit-scrollbar { display: none; }
    .dept-chip {
      flex: none; border: 1px solid var(--border); background: rgba(255,255,255,.96);
      color: var(--ink); border-radius: 999px; padding: 8px 12px; font-size: 11px; font-weight: 700;
      white-space: nowrap; max-width: 180px; overflow: hidden; text-overflow: ellipsis;
    }
    .dept-chip.active { background: var(--blue); border-color: var(--blue); color: #fff; }
    .dept-chip:active { background: var(--blue-soft); }

    .sheet {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--card);
      border-radius: 20px 20px 0 0; box-shadow: 0 -6px 24px rgba(32,33,36,.12);
      max-height: 74%; display: flex; flex-direction: column;
      padding-bottom: var(--safe-b); transition: transform .25s ease;
    }
    .sheet.collapsed { transform: translateY(calc(100% - 96px)); }
    .grabber { padding: 10px; display: flex; justify-content: center; }
    .grabber i { width: 42px; height: 4px; background: var(--border); border-radius: 999px; display: block; }
    .tabs { display: flex; gap: 6px; padding: 0 12px 10px; }
    .tab { flex: 1; border: 1px solid var(--border); background: var(--bg); color: var(--muted); padding: 9px 2px; border-radius: 999px; font-size: 11px; font-weight: 700; }
    .card-btn { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 12px; border-radius: 14px; border: 1px solid var(--border); background: var(--card); margin-bottom: 8px; font-size: 13px; font-weight: 700; color: var(--ink); }
    .card-btn span { display: block; font-size: 11px; font-weight: 500; color: var(--muted); margin-top: 3px; }
    .card-btn .si { font-size: 18px; color: var(--blue); }
    .warn-pill { background: #FDECEA; color: var(--red); }
    .tab.active { background: var(--blue); border-color: var(--blue); color: #fff; }
    .sheet-head { display: flex; align-items: baseline; gap: 8px; padding: 0 16px 10px; }
    .sheet-head h2 { font-size: 16px; font-weight: 800; }
    .sheet-head .count { color: var(--muted); font-size: 12px; }
    .sheet-body { overflow: auto; padding: 0 12px 16px; -webkit-overflow-scrolling: touch; }

    .row {
      display: flex; gap: 10px; align-items: center; padding: 10px; border-radius: var(--radius);
      background: var(--card); border: 1px solid var(--border); margin-bottom: 8px;
    }
    .row img { width: 54px; height: 54px; object-fit: contain; border-radius: 10px; background: var(--bg); }
    .row .info { flex: 1; min-width: 0; }
    .row .name { font-size: 13px; font-weight: 600; line-height: 1.35; }
    .row .sub { font-size: 11px; color: var(--muted); margin-top: 5px; display: flex; gap: 5px; flex-wrap: wrap; align-items: center; }
    .pill { background: var(--bg); border-radius: 999px; padding: 3px 9px; font-size: 10px; color: var(--muted); }
    .pill.promo { background: var(--yellow); color: #4A3208; font-weight: 800; }
    .price { font-weight: 800; font-size: 15px; white-space: nowrap; text-align: right; }
    .price s { display: block; font-weight: 400; font-size: 10px; color: var(--muted); }
    .acts { display: flex; flex-direction: column; gap: 6px; }
    .btn {
      border: 0; border-radius: 999px; padding: 9px 12px; font-size: 11px; font-weight: 700;
      min-width: 68px; display: inline-flex; align-items: center; justify-content: center; gap: 5px;
    }
    .btn .si { font-size: 13px; }
    .btn-blue { background: var(--blue); color: #fff; }
    .btn-blue:active { background: var(--blue-dark); }
    .btn-ink { background: var(--ink); color: #fff; }
    .btn-plain { background: var(--bg); color: var(--ink); border: 1px solid var(--border); }
    .btn-wide { width: 100%; padding: 14px; font-size: 14px; margin-top: 8px; }

    .promo-block { border: 1px solid var(--yellow); background: #FFFBF2; border-radius: var(--radius); padding: 10px; margin-bottom: 10px; }
    .promo-block h3 { font-size: 12px; font-weight: 800; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
    .promo-block h3 .si { color: var(--orange); font-size: 15px; }
    .promo-block h3 b { background: var(--yellow); border-radius: 999px; padding: 3px 9px; font-size: 10px; color: #4A3208; }
    .promo-row { display: flex; gap: 10px; align-items: center; padding: 8px; background: #fff; border: 1px solid var(--border); border-radius: 14px; margin-bottom: 6px; }
    .promo-row img { width: 44px; height: 44px; object-fit: contain; border-radius: 10px; background: var(--bg); }
    .promo-row .info { flex: 1; min-width: 0; }
    .promo-row .name { font-size: 12px; font-weight: 600; }
    .promo-row .meta { font-size: 10px; color: var(--muted); margin-top: 3px; }
    .save { background: var(--red); color: #fff; border-radius: 999px; padding: 3px 8px; font-size: 10px; font-weight: 800; text-align: center; }

    .store { padding: 12px; border-radius: 14px; margin-bottom: 6px; background: var(--card); border: 1px solid var(--border); }
    .store:active { background: var(--blue-soft); }
    .store .city { font-size: 13px; font-weight: 800; }
    .store .addr { font-size: 12px; color: var(--muted); margin-top: 3px; }
    .store .flags { font-size: 10px; color: var(--green); margin-top: 5px; font-weight: 600; }
    .store .flags.closed { color: var(--muted); }

    .empty { text-align: center; color: var(--muted); font-size: 12px; padding: 24px 12px; line-height: 1.55; }
    .banner { margin: 0 0 10px; padding: 12px; border-radius: 14px; font-size: 12px; line-height: 1.5; }
    .banner.warn { background: var(--yellow-soft); color: #7A5416; }
    .banner.err { background: #FDECEA; color: var(--red); }
    .banner.ok { background: #E8F8EC; color: #0A7A25; }
    .banner.info { background: var(--blue-soft); color: var(--blue-dark); }
    .listline { display: flex; gap: 8px; padding: 0 0 10px; }
    .listline input { flex: 1; border: 1px solid var(--border); border-radius: 14px; padding: 12px; font-size: 14px; background: var(--bg); }
    .step { display: flex; gap: 10px; align-items: center; padding: 11px 12px; background: var(--card); border: 1px solid var(--border); border-radius: 14px; margin-bottom: 6px; font-size: 12px; }
    .step b { width: 24px; height: 24px; border-radius: 999px; background: var(--blue); color: #fff; font-size: 11px; display: grid; place-items: center; flex: none; }
    .total { display: flex; justify-content: space-between; align-items: center; padding: 14px; background: var(--blue-soft); border-radius: 14px; font-size: 14px; font-weight: 800; margin-bottom: 8px; color: var(--blue-dark); }

    @media (min-width: 900px) {
      body { flex-direction: row; }
      .side { width: 420px; background: var(--card); border-right: 1px solid var(--border); }
      .sheet { position: static; z-index: auto; max-height: none; flex: 1; box-shadow: none; border-radius: 0; transform: none !important; }
      .grabber { display: none; }
      main { flex: 1; }
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div class="side">
    <header>
      <div class="logo"><span>Сільпо</span> Навігатор</div>
      <div class="chip bonus hidden" id="bonusChip"></div>
      <button class="chip cart hidden" id="cartChip"><i class="si si-cart"></i><span id="cartText">Кошик</span></button>
      <button class="icon-btn" id="reloadBtn" title="Оновити"><i class="si si-refresh"></i></button>
    </header>

    <div class="searchbar">
      <div class="field">
        <i class="si si-search"></i>
        <input id="mainInput" type="search" placeholder="Я шукаю..." enterkeyhint="search">
      </div>
      <div class="storechip">
        <i class="si si-location"></i>
        <span id="storeChipText">Магазин не обрано</span>
        <button id="changeStoreBtn">Змінити</button>
      </div>
    </div>

    <section class="sheet" id="sheet">
      <div class="grabber" id="grabber"><i></i></div>
      <div class="tabs">
        <button class="tab active" data-tab="products">Товари</button>
        <button class="tab" data-tab="list">Список</button>
        <button class="tab" data-tab="me">Для мене</button>
        <button class="tab" data-tab="stores">Магазини</button>
        <button class="tab" data-tab="cart">Кошик</button>
      </div>
      <div class="sheet-head">
        <h2 id="sheetTitle">Пошук товарів</h2>
        <span class="count" id="sheetCount"></span>
      </div>
      <div class="sheet-body" id="sheetBody"></div>
    </section>
  </div>

  <main>
    <canvas id="map"></canvas>
    <div class="map-hint" id="mapHint">Оберіть магазин, щоб побудувати 3D-схему залу</div>
    <div class="zoom">
      <button id="zoomIn" title="Ближче"><i class="si si-plus"></i></button>
      <button id="zoomOut" title="Далі"><i class="si si-minus"></i></button>
      <button id="zoomReset" title="Весь зал"><i class="si si-zoom-out"></i></button>
      <button id="shuffleBtn" title="Інша планіровка"><i class="si si-routes"></i></button>
    </div>
    <div class="mcp-badge" id="mcpBadge"><i class="si si-shop"></i>MCP «Сільпо»</div>
    <div class="dept-strip hidden" id="deptStrip"></div>
  </main>

  <script type="module">
    import { StoreMap3D } from './js/store3d.js';

    const el = (id) => document.getElementById(id);
    const map = new StoreMap3D(el('map'));
    const sheet = el('sheet');
    const sheetBody = el('sheetBody');
    const sheetTitle = el('sheetTitle');
    const sheetCount = el('sheetCount');
    const mainInput = el('mainInput');
    const mapHint = el('mapHint');

    let tab = 'products';
    let store = null;
    let stores = [];
    let layout = null;
    let seed = null;
    let products = [];
    let promos = { title: '', suggestions: [] };
    let shoppingList = [];
    let cart = null;
    let guest = null;
    let personal = { favorites: [], sets: [], onlineOrders: [], offlineOrders: [] };
    let insight = null;

    const esc = (v) => String(v ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const money = (v) => (v == null ? '' : `${Number(v).toFixed(2).replace('.00', '')} ₴`);
    const icon = (name) => `<i class="si si-${name}"></i>`;

    async function api(url, options) {
      const res = await fetch(url, options);
      const data = await res.json().catch(() => ({ success: false, error: 'Сервер не відповів' }));
      if (data.needsAuth) {
        renderAuth(data.authUrl);
        throw new Error('needs_auth');
      }
      return data;
    }

    function setTab(next) {
      tab = next;
      document.querySelectorAll('.tab').forEach((b) => b.classList.toggle('active', b.dataset.tab === next));
      mainInput.placeholder = next === 'stores' ? 'Місто, вулиця або адреса' : 'Я шукаю...';
      render();
    }

    function render() {
      if (tab === 'stores') return renderStores();
      if (tab === 'list') return renderList();
      if (tab === 'cart') return renderCart();
      if (tab === 'me') return renderMe();
      renderProducts();
    }

    async function boot() {
      const status = await fetch('/api/mcp/status').then((r) => r.json()).catch(() => ({}));
      if (!status.connected) return renderAuth(status.authUrl);

      el('mcpBadge').innerHTML = `${icon('shop')}MCP «Сільпо» · ${status.toolsCount} tools · ${status.usedTools} у роботі`;
      loadMe().catch(() => {});
      loadCart();
      await loadStores();

      const saved = JSON.parse(localStorage.getItem('silpo.store') || 'null');
      if (saved?.id) await pickStore(saved);
      else setTab('stores');
    }

    function renderAuth(authUrl) {
      setTab('products');
      sheetTitle.textContent = 'Вхід у «Сільпо»';
      sheetCount.textContent = '';
      sheetBody.innerHTML = `
        <div class="banner info">Навігатор працює від імені гостя через офіційний MCP «Сільпо»: магазини, категорії, товари, акції та кошик — реальні. Увійдіть у свій акаунт, щоб почати.</div>
        <button class="btn btn-blue btn-wide" id="loginBtn">${icon('user')}Увійти через «Сільпо»</button>
        <button class="btn btn-plain btn-wide" id="recheckBtn">Я вже увійшов — перевірити</button>`;

      el('loginBtn').onclick = async () => {
        const data = authUrl ? { authUrl } : await fetch('/api/mcp/auth', { method: 'POST' }).then((r) => r.json());
        if (data.authUrl) window.open(data.authUrl, '_blank', 'noopener');
        el('loginBtn').innerHTML = `${icon('clock')}Очікую підтвердження…`;
        const timer = setInterval(async () => {
          const st = await fetch('/api/mcp/status').then((r) => r.json()).catch(() => ({}));
          if (st.connected) {
            clearInterval(timer);
            boot();
          }
        }, 2500);
      };
      el('recheckBtn').onclick = boot;
    }

    async function loadMe() {
      const data = await api('/api/me').catch(() => null);
      if (!data?.success) return;
      guest = data;
      const bonus = data?.loyalty?.loyalty?.bonusTotal ?? data?.loyalty?.bonusTotal;
      if (bonus != null) {
        el('bonusChip').classList.remove('hidden');
        el('bonusChip').innerHTML = `${icon('gift')}${Number(bonus).toFixed(2)}`;
      }
      if (tab === 'me') renderMe();
    }

    async function loadPersonal() {
      if (!store) return;
      const data = await api(`/api/personal?branchId=${encodeURIComponent(store.id)}&seed=${encodeURIComponent(seed || store.id)}`).catch(() => null);
      if (!data?.success) return;
      personal = data;
      if (guest?.family?.zones?.length && layout) {
        for (const shelf of layout.shelves) {
          shelf.family = guest.family.zones.includes(shelf.zone);
        }
      }
      if (tab === 'me') renderMe();
    }

    function cartLabel() {
      return cart?.count ? `${cart.count} · ${money(cart.total)}` : 'Кошик';
    }

    async function loadCart() {
      const data = await api('/api/cart').catch(() => null);
      if (!data?.success) return;
      cart = data.cart;
      el('cartChip').classList.remove('hidden');
      el('cartText').textContent = cartLabel();
      if (tab === 'cart') renderCart();
    }

    async function loadStores(q = '') {
      const data = await api(`/api/stores?q=${encodeURIComponent(q)}`).catch(() => null);
      if (!data?.success) return;
      stores = data.stores;
      if (tab === 'stores') renderStores();
    }

    function renderStores() {
      sheetTitle.textContent = 'Магазини «Сільпо»';
      sheetCount.textContent = `${stores.length} знайдено`;
      const saved = (guest?.addresses || []).slice(0, 3);
      const near = saved.length
        ? `<div class="banner info">Збережені адреси — знайду найближчий магазин і типи доставки.</div>
           ${saved.map((a, i) => {
             const title = a.title || a.address || [a.city, a.street, a.house].filter(Boolean).join(', ');
             return `<button class="card-btn" data-saved="${i}">${icon('pin')}<div>${esc(title)}<span>Найближчі філії до цієї адреси</span></div></button>`;
           }).join('')}`
        : '';
      const list = !stores.length
        ? '<p class="empty">Нічого не знайдено.<br>Спробуйте вулицю, місто або повну адресу.</p>'
        : stores.slice(0, 120).map((s, i) => `
          <div class="store" data-i="${i}">
            <div class="city">${esc(s.city || 'Магазин')}${s.km != null ? ` · ${s.km} км` : ''}</div>
            <div class="addr">${esc(s.address)}</div>
            <div class="flags${s.open ? '' : ' closed'}">${s.open ? 'Працює' : 'Закритий'}${s.hasPickup ? ' · самовивіз' : ''}</div>
          </div>`).join('');
      sheetBody.innerHTML = near + list;
      sheetBody.querySelectorAll('.store').forEach((node) => {
        node.onclick = () => pickStore(stores[Number(node.dataset.i)]);
      });
      sheetBody.querySelectorAll('[data-saved]').forEach((btn) => {
        btn.onclick = () => nearestFromSaved(guest.addresses[Number(btn.dataset.saved)]);
      });
    }

    async function nearestFromQuery(text) {
      sheetBody.innerHTML = '<p class="empty">Шукаю координати адреси і типи доставки…</p>';
      const data = await api('/api/nearest', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ address: text })
      }).catch(() => null);
      if (!data?.success) {
        sheetBody.innerHTML = `<div class="banner err">${esc(data?.error || 'Адресу не знайдено')}</div>`;
        return;
      }
      stores = data.stores;
      sheetTitle.textContent = 'Найближчі магазини';
      sheetCount.textContent = data.stores.length ? `від ${data.stores[0].km} км` : '';
      const types = data.deliveryTypes.length
        ? `<div class="banner ok">Доставка сюди: ${esc(data.deliveryTypes.map((t) => t.title).join(', '))}</div>`
        : '';
      sheetBody.innerHTML = types + data.stores.map((s, i) => `
        <div class="store" data-i="${i}">
          <div class="city">${esc(s.city)} · ${s.km} км</div>
          <div class="addr">${esc(s.address)}</div>
          <div class="flags${s.open ? '' : ' closed'}">${s.open ? 'Працює' : 'Закритий'}${s.hasPickup ? ' · самовивіз' : ''}</div>
        </div>`).join('');
      sheetBody.querySelectorAll('.store').forEach((node) => {
        node.onclick = () => pickStore(stores[Number(node.dataset.i)]);
      });
    }

    async function nearestFromSaved(addr) {
      const lat = addr.latitude ?? addr.lat;
      const lng = addr.longitude ?? addr.lng;
      if (lat != null && lng != null) {
        const data = await api('/api/nearest', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ latitude: lat, longitude: lng })
        }).catch(() => null);
        if (data?.success) {
          stores = data.stores;
          renderStores();
          return;
        }
      }
      const title = addr.title || addr.address || [addr.city, addr.street, addr.house].filter(Boolean).join(', ');
      if (title) nearestFromQuery(title);
    }

    async function pickStore(next, newSeed) {
      store = next;
      seed = newSeed || store.id;
      localStorage.setItem('silpo.store', JSON.stringify(next));
      el('storeChipText').innerHTML = `<strong>${esc(next.city)}</strong>, ${esc(next.address)}`;
      mapHint.textContent = 'Генерую планіровку залу та розставляю відділи з MCP…';
      if (!newSeed) setTab('products');
      sheetBody.innerHTML = '<p class="empty">Завантажую відділи магазину…</p>';

      const data = await api(
        `/api/layout?branchId=${encodeURIComponent(next.id)}&seed=${encodeURIComponent(seed)}`
      ).catch(() => null);
      if (!data) return;
      if (!data.success) {
        mapHint.textContent = 'Не вдалося отримати категорії магазину';
        sheetBody.innerHTML = `<div class="banner err">${esc(data.error)}</div>`;
        return;
      }

      layout = data.layout;
      promos = { title: '', suggestions: [] };
      map.loadLayout(layout);
      map.onShelfTap = (id) => selectShelf(id);
      renderDeptStrip();
      mapHint.textContent = `${layout.shelves.length} відділів · зал ${layout.floor.width}×${layout.floor.depth} м · оберіть стелаж на карті або зі стрічки`;
      loadPersonal();
      if (tab === 'products') renderProducts();
    }

    function renderDeptStrip() {
      const strip = el('deptStrip');
      if (!layout?.shelves?.length) {
        strip.classList.add('hidden');
        strip.innerHTML = '';
        return;
      }
      strip.classList.remove('hidden');
      strip.innerHTML = layout.shelves.map((s) =>
        `<button class="dept-chip" data-shelf="${esc(s.id)}" title="${esc(s.name)}">${esc(s.name)}</button>`
      ).join('');
      strip.querySelectorAll('[data-shelf]').forEach((btn) => {
        btn.onclick = () => selectShelf(btn.dataset.shelf);
      });
    }

    function markDeptChip(id) {
      el('deptStrip').querySelectorAll('.dept-chip').forEach((btn) => {
        btn.classList.toggle('active', btn.dataset.shelf === id);
      });
    }

    function selectShelf(id) {
      const shelf = layout?.shelves.find((s) => s.id === id);
      if (!shelf) return;
      map.highlight(id);
      map.showRoute(shelf.route);
      markDeptChip(id);
      const bits = [`${shelf.name} · ${shelf.total} товарів`];
      if (shelf.popular) bits.push('зараз популярний відділ');
      if (shelf.family) bits.push('для вашої родини');
      mapHint.textContent = bits.join(' · ');
      loadOnTheWay(shelf.route, [shelf.id]);
      openShelf(shelf);
    }

    async function searchProducts(query) {
      if (!store) { setTab('stores'); return; }
      setTab('products');
      sheetTitle.textContent = `«${query}»`;
      sheetBody.innerHTML = '<p class="empty">Шукаю в каталозі магазину…</p>';

      const data = await api('/api/search', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ branchId: store.id, query, seed })
      }).catch(() => null);

      if (!data) return;
      if (!data.success) {
        sheetBody.innerHTML = `<div class="banner err">${esc(data.error)}</div>`;
        return;
      }

      products = data.products;
      promos = { title: '', suggestions: [] };
      sheetCount.textContent = `${data.totalFound} у магазині`;
      renderProducts();
      if (products[0]) focusProduct(products[0]);
    }

    function restrictionHit(p) {
      const hay = `${p.name || ''} ${p.category || ''}`.toLowerCase();
      return (guest?.restrictions || []).filter((r) => {
        const key = String(r).toLowerCase();
        if (/безглютен|gluten/i.test(key)) return /пшен|глютен|хліб|батон|макарон/.test(hay);
        if (/лактоз|lactos|молоч/i.test(key)) return /молок|сир|йогурт|вершк|масло/.test(hay);
        if (/веган|vegan/i.test(key)) return /мʼяс|мяс|ковбас|риб|молоч|сир|яйц/.test(hay);
        return false;
      });
    }

    function productRow(p, index, bag = 'products') {
      const warns = restrictionHit(p);
      return `
        <div class="row">
          ${p.image ? `<img src="${esc(p.image)}" alt="" loading="lazy">` : ''}
          <div class="info">
            <div class="name">${esc(p.name)}</div>
            <div class="sub">
              ${p.displayRatio ? `<span class="pill">${esc(p.displayRatio)}</span>` : ''}
              ${p.shelfName ? `<span class="pill">${esc(p.shelfName)}</span>` : ''}
              ${p.hasPromotion ? '<span class="pill promo">Акція</span>' : ''}
              ${warns.map((w) => `<span class="pill warn-pill">${esc(w)}</span>`).join('')}
            </div>
          </div>
          <div class="price">${money(p.price)}${p.oldPrice ? `<s>${money(p.oldPrice)}</s>` : ''}</div>
          <div class="acts">
            <button class="btn btn-ink" data-go="${index}" data-bag="${bag}">${icon('route')}Шлях</button>
            <button class="btn btn-blue" data-cart="${index}" data-bag="${bag}">${icon('cart-add')}Кошик</button>
            <button class="btn btn-plain" data-fav="${index}" data-bag="${bag}">${icon('heart')}</button>
            ${p.slug ? `<button class="btn btn-plain" data-info="${index}" data-bag="${bag}">i</button>` : ''}
          </div>
        </div>`;
    }

    function renderProducts() {
      if (tab !== 'products') return;
      if (!store) {
        sheetBody.innerHTML = '<p class="empty">Спершу оберіть магазин на вкладці «Магазини».</p>';
        return;
      }
      if (!products.length) {
        sheetBody.innerHTML = '<p class="empty">Введіть назву товару — покажу стелаж, шлях від входу<br>і Цінотижики, що трапляться по дорозі.</p>';
        return;
      }

      sheetBody.innerHTML = promoBlock() + products.map(productRow).join('');
      bindProductActions();
    }

    function promoBlock() {
      if (!promos.suggestions.length) return '';
      return `
        <div class="promo-block">
          <h3>${icon('sale')}По дорозі <b>${esc(promos.title)}</b></h3>
          ${promos.suggestions.map((s, i) => `
            <div class="promo-row" data-promo-go="${i}">
              ${s.product.image ? `<img src="${esc(s.product.image)}" alt="" loading="lazy">` : ''}
              <div class="info">
                <div class="name">${esc(s.product.name)}</div>
                <div class="meta">${esc(s.shelfName)} · ${s.detourMeters < 1.5 ? 'просто по дорозі' : `+${s.detourMeters} м вбік`}</div>
              </div>
              <div class="price">${money(s.product.price)}<s>${money(s.product.oldPrice)}</s></div>
              <div class="acts">
                <span class="save">−${s.discountPercent}%</span>
                <button class="btn btn-blue" data-promo-cart="${i}">${icon('cart-add')}</button>
              </div>
            </div>`).join('')}
        </div>`;
    }

    function bindProductActions() {
      const bagOf = (node) => {
        const name = node.dataset.bag || 'products';
        if (name === 'favorites') return personal.favorites;
        if (name === 'similar') return insight?.similar || [];
        if (name === 'replacements') return insight?.replacements || [];
        return products;
      };
      sheetBody.querySelectorAll('[data-go]').forEach((b) => {
        b.onclick = () => focusProduct(bagOf(b)[Number(b.dataset.go)]);
      });
      sheetBody.querySelectorAll('[data-cart]').forEach((b) => {
        b.onclick = () => addToCart(bagOf(b)[Number(b.dataset.cart)], b);
      });
      sheetBody.querySelectorAll('[data-fav]').forEach((b) => {
        b.onclick = () => toggleFav(bagOf(b)[Number(b.dataset.fav)], b);
      });
      sheetBody.querySelectorAll('[data-info]').forEach((b) => {
        b.onclick = () => openInsight(bagOf(b)[Number(b.dataset.info)]);
      });
      sheetBody.querySelectorAll('[data-promo-cart]').forEach((b) => {
        b.onclick = (event) => {
          event.stopPropagation();
          addToCart(promos.suggestions[Number(b.dataset.promoCart)].product, b);
        };
      });
      sheetBody.querySelectorAll('[data-promo-go]').forEach((node) => {
        node.onclick = () => {
          const suggestion = promos.suggestions[Number(node.dataset.promoGo)];
          map.highlight(suggestion.shelfId);
          map.showRoute(suggestion.product.route);
          mapHint.textContent = `${suggestion.product.name} → ${suggestion.shelfName}`;
        };
      });
    }

    async function addToCart(product, button) {
      if (!product || !store) return;
      const label = button.innerHTML;
      button.innerHTML = '…';
      const data = await api('/api/cart/add', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          branchId: product.branchId || store.id,
          productId: product.id,
          companyId: product.companyId,
          quantity: 1
        })
      }).catch(() => null);

      if (!data?.success) {
        button.innerHTML = 'помилка';
        setTimeout(() => { button.innerHTML = label; }, 2000);
        return;
      }

      cart = data.cart;
      button.innerHTML = icon('check');
      el('cartText').textContent = cartLabel();
      setTimeout(() => { button.innerHTML = label; }, 1800);
    }

    async function focusProduct(p) {
      if (!p?.route || p.route.length < 2) return;
      map.highlight(p.shelfId);
      map.showRoute(p.route);
      markDeptChip(p.shelfId);
      mapHint.textContent = `${p.name} → ${p.shelfName || 'стелаж'}`;
      if (window.innerWidth < 900) sheet.classList.add('collapsed');
      await loadOnTheWay(p.route, [p.shelfId]);
    }

    async function loadOnTheWay(route, skipShelfIds) {
      if (!store) return;
      const data = await api('/api/on-the-way', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ branchId: store.id, seed, route, skipShelfIds })
      }).catch(() => null);

      if (!data?.success || !data.suggestions.length) return;
      promos = { title: data.promoTitle, suggestions: data.suggestions };
      if (tab === 'products') renderProducts();
    }

    async function toggleFav(product, button) {
      if (!product?.id || !product.externalProductId) {
        button.innerHTML = '!';
        return;
      }
      const label = button.innerHTML;
      button.innerHTML = '…';
      const data = await api('/api/favorites', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          productId: product.id,
          externalProductId: String(product.externalProductId),
          toDelete: false
        })
      }).catch(() => null);
      button.innerHTML = data?.success ? icon('check') : label;
    }

    async function openInsight(product) {
      if (!store || !product?.slug) return;
      setTab('products');
      sheetTitle.textContent = product.name;
      sheetBody.innerHTML = '<p class="empty">Дивлюсь склад, схожі товари і ризик збірки…</p>';
      const data = await api('/api/product', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          branchId: store.id,
          slug: product.slug,
          productId: product.id,
          companyId: product.companyId,
          seed
        })
      }).catch(() => null);
      if (!data?.success) {
        sheetBody.innerHTML = `<div class="banner err">${esc(data?.error || 'Немає деталей')}</div>`;
        return;
      }
      insight = data;
      const details = data.details || {};
      const attrs = listText(details.attributes || details.properties || details.nutrition);
      sheetBody.innerHTML = `
        ${data.atRisk ? '<div class="banner warn">Збірщик може не знайти цей товар — нижче заміна на іншій полиці.</div>' : ''}
        ${attrs ? `<div class="banner info">${esc(attrs)}</div>` : ''}
        ${data.replacements.length ? `<h3 style="font-size:13px;margin:8px 0">Заміна в цьому залі</h3>${data.replacements.map((p, i) => productRow(p, i, 'replacements')).join('')}` : ''}
        ${data.similar.length ? `<h3 style="font-size:13px;margin:8px 0">Схожі — інший стелаж поряд</h3>${data.similar.map((p, i) => productRow(p, i, 'similar')).join('')}` : '<p class="empty">Схожих у цій філії немає.</p>'}`;
      bindProductActions();
      if (data.replacements[0]) focusProduct(data.replacements[0]);
      else if (product.route) focusProduct(product);
    }

    function listText(value) {
      if (!value) return '';
      if (typeof value === 'string') return value;
      if (Array.isArray(value)) {
        return value.map((item) => {
          if (typeof item === 'string') return item;
          return [item.name || item.title, item.value].filter(Boolean).join(': ');
        }).filter(Boolean).slice(0, 8).join(' · ');
      }
      return '';
    }

    async function openShelf(shelf) {
      if (!store || !shelf.slug) return;
      api(`/api/shelf?branchId=${encodeURIComponent(store.id)}&slug=${encodeURIComponent(shelf.slug)}`)
        .then((data) => {
          if (!data?.success) return;
          const cat = data.category || {};
          const extra = cat.visible === false ? ' · у цій філії порожньо' : '';
          mapHint.textContent = `${shelf.name}${cat.minPrice != null ? ` · від ${money(cat.minPrice)}` : ''}${extra}`;
        })
        .catch(() => {});
    }

    function showPacked(title, data) {
      products = data.products || [];
      setTab('products');
      sheetTitle.textContent = title;
      sheetCount.textContent = `${data.order?.length || 0} відділів`;
      map.showRoute(data.route);
      map.highlight(null);
      markDeptChip(null);
      mapHint.textContent = `${title} · вхід → ${data.order?.length || 0} відділів → каси`;
      sheetBody.innerHTML =
        (data.order || []).map((s, i) => `<div class="step"><b>${i + 1}</b><span>${esc(s.name)}</span></div>`).join('') +
        products.map((p, i) => productRow(p, i)).join('');
      bindProductActions();
    }

    function renderMe() {
      sheetTitle.textContent = 'Маршрут під вас';
      sheetCount.textContent = guest?.premium?.active ? 'Плюхс' : '';
      if (!store) {
        sheetBody.innerHTML = '<p class="empty">Оберіть магазин — тоді зберу улюблені, набори й минулі чеки саме цієї філії.</p>';
        return;
      }
      const family = guest?.family;
      const familyLine = family
        ? `${family.children ? `${family.children} діт.` : ''}${family.pets ? `${family.children ? ' · ' : ''}${family.pets} улюблен.` : ''}`.trim()
        : '';
      sheetBody.innerHTML = `
        ${guest?.restrictions?.length ? `<div class="banner warn">Обмеження: ${esc(guest.restrictions.join(', '))} — підсвічую ризикові товари в видачі.</div>` : ''}
        ${familyLine ? `<div class="banner info">Родина: ${esc(familyLine)}. Відділи «дитячі» і «зоо» підсвічені на схемі.</div>` : ''}
        ${guest?.premium?.active
          ? `<div class="banner ok">Плюхс активний${guest.premium.shareWebLink ? ` · <a href="${esc(guest.premium.shareWebLink)}" target="_blank" rel="noreferrer">поділитись</a>` : ''}</div>`
          : guest?.premium
            ? `<div class="banner info">Плюхс не оформлено${guest.premium.webLink ? ` · <a href="${esc(guest.premium.webLink)}" target="_blank" rel="noreferrer">на сайті</a>` : ''}${guest.premium.mobileLink ? ` · <a href="${esc(guest.premium.mobileLink)}" target="_blank" rel="noreferrer">в застосунку</a>` : ''}</div>`
            : ''}
        <button class="card-btn" id="favRoute">${icon('heart')}<div>Маршрут по улюблених<span>${personal.favorites.length} товарів у цій філії</span></div></button>
        <button class="card-btn" id="offlineRoute">${icon('shop')}<div>Як минулого разу в залі<span>${personal.offlineOrders[0]?.title || 'останній чек за карткою лояльності'}</span></div></button>
        <button class="card-btn" id="onlineRoute">${icon('basket')}<div>Повторити онлайн-замовлення<span>${personal.onlineOrders[0]?.title || 'останнє доставлене замовлення'}</span></div></button>
        ${(personal.sets || []).slice(0, 8).map((s, i) => `
          <button class="card-btn" data-set="${i}">${icon('categories')}<div>${esc(s.title)}<span>готовий набір · маршрут по відділах</span></div></button>
        `).join('')}
        ${guest?.coupons?.length ? `<div class="banner warn">Купони: ${guest.coupons.length} шт. Деталі вже підтягнуті з MCP.</div>` : ''}
        ${guest?.promoCodes?.length ? `<div class="banner ok">Промокоди: ${esc(guest.promoCodes.map((c) => c.code || c.title || c).slice(0, 4).join(', '))}</div>` : ''}
        ${guest?.certificates?.length ? `<div class="banner info">Сертифікати: ${guest.certificates.length} шт. — застосую в кошику.</div>` : ''}
      `;
      el('favRoute').onclick = () => packedRoute('/api/route/favorites', { branchId: store.id, seed }, 'Улюблені');
      el('offlineRoute').onclick = () => packedRoute('/api/route/repeat', { branchId: store.id, seed, source: 'offline' }, 'Останній чек');
      el('onlineRoute').onclick = () => packedRoute('/api/route/repeat', { branchId: store.id, seed, source: 'online' }, 'Онлайн-замовлення');
      sheetBody.querySelectorAll('[data-set]').forEach((btn) => {
        btn.onclick = () => {
          const set = personal.sets[Number(btn.dataset.set)];
          packedRoute('/api/route/set', { branchId: store.id, seed, slug: set.slug }, set.title);
        };
      });
    }

    async function packedRoute(url, body, title) {
      sheetBody.innerHTML = '<p class="empty">Складаю маршрут…</p>';
      const data = await api(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      }).catch(() => null);
      if (!data?.success) {
        sheetBody.innerHTML = `<div class="banner err">${esc(data?.error || 'Немає даних для маршруту')}</div>`;
        return;
      }
      showPacked(title, data);
    }

    function renderList() {
      sheetTitle.textContent = 'Список покупок';
      sheetCount.textContent = shoppingList.length ? `${shoppingList.length} товарів` : '';
      const items = shoppingList.length
        ? shoppingList.map((p, i) => `
          <div class="row">
            ${p.image ? `<img src="${esc(p.image)}" alt="" loading="lazy">` : ''}
            <div class="info">
              <div class="name">${esc(p.name)}</div>
              <div class="sub">${p.shelfName ? `<span class="pill">${esc(p.shelfName)}</span>` : ''}</div>
            </div>
            <div class="price">${money(p.price)}</div>
            <button class="btn btn-plain" data-del="${i}">${icon('close')}</button>
          </div>`).join('')
        : '<p class="empty">Введіть список через кому — прокладу маршрут через усі відділи до кас<br>і додам знайдене в кошик «Сільпо».</p>';

      sheetBody.innerHTML = `
        <div class="listline">
          <input id="bulkInput" placeholder="молоко, хліб, банани, кава">
          <button class="btn btn-ink" id="bulkBtn">${icon('route')}Маршрут</button>
        </div>
        ${items}
        ${shoppingList.length ? `<button class="btn btn-blue btn-wide" id="listToCartBtn">${icon('cart-add')}Додати весь список у кошик</button>` : ''}`;

      el('bulkBtn').onclick = () => bulkRoute(el('bulkInput').value);
      el('bulkInput').onkeydown = (e) => { if (e.key === 'Enter') bulkRoute(e.target.value); };
      sheetBody.querySelectorAll('[data-del]').forEach((b) => {
        b.onclick = () => { shoppingList.splice(Number(b.dataset.del), 1); renderList(); };
      });
      if (el('listToCartBtn')) el('listToCartBtn').onclick = (e) => addListToCart(e.currentTarget);
    }

    async function bulkRoute(raw) {
      const items = String(raw || '').split(/[,;\n]/).map((s) => s.trim()).filter(Boolean);
      if (!store || !items.length) return;
      setTab('list');
      sheetBody.innerHTML = '<p class="empty">Складаю маршрут по відділах…</p>';

      const data = await api('/api/list-search', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ branchId: store.id, items, seed })
      }).catch(() => null);

      if (!data) return;
      if (!data.success) {
        sheetBody.innerHTML = `<div class="banner err">${esc(data.error)}</div>`;
        return;
      }

      shoppingList = data.results.map((r) => r.best).filter(Boolean);
      map.showRoute(data.route);
      map.highlight(null);
      markDeptChip(null);
      sheetTitle.textContent = 'Маршрут по списку';
      sheetCount.textContent = `${data.order.length} відділів`;
      mapHint.textContent = `Вхід → ${data.order.length} відділів → каси`;

      const missing = data.results.filter((r) => !r.best).map((r) => r.query);
      sheetBody.innerHTML =
        data.order.map((s, i) => `<div class="step"><b>${i + 1}</b><span>${esc(s.name)}</span></div>`).join('') +
        (missing.length ? `<div class="banner warn">Не знайшли в цьому магазині: ${esc(missing.join(', '))}</div>` : '') +
        shoppingList.map(productRow).join('') +
        `<button class="btn btn-blue btn-wide" id="listToCartBtn">${icon('cart-add')}Додати весь список у кошик</button>`;

      bindProductActions();
      el('listToCartBtn').onclick = (e) => addListToCart(e.currentTarget);
    }

    async function addListToCart(button) {
      button.innerHTML = 'Додаю…';
      for (const product of shoppingList) {
        await api('/api/cart/add', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            branchId: product.branchId || store.id,
            productId: product.id,
            companyId: product.companyId,
            quantity: 1
          })
        }).catch(() => null);
      }
      await loadCart();
      button.innerHTML = `${icon('check')}У кошику · ${money(cart?.total)}`;
    }

    async function renderCart() {
      sheetTitle.textContent = 'Кошик «Сільпо»';
      if (!cart) {
        sheetBody.innerHTML = '<p class="empty">Завантажую кошик…</p>';
        await loadCart();
        if (!cart) return;
      }
      sheetCount.textContent = cart.count ? `${cart.count} шт` : 'порожній';
      sheetBody.innerHTML = `
        <div class="total"><span>До сплати</span><span>${money(cart.total)}</span></div>
        ${cart.discount ? `<div class="banner ok">Знижка в кошику: ${money(cart.discount)}</div>` : ''}
        ${cart.bonusTotal != null ? `<div class="banner warn">Балабонуси: ${money(cart.bonusTotal)} · доступно зараз ${money(cart.bonusAvailable)}</div>` : ''}
        ${cart.items.length
          ? cart.items.map((i) => `
            <div class="row">
              <div class="info">
                <div class="name">${esc(i.name)}</div>
                <div class="sub"><span class="pill">${i.quantity} шт</span></div>
              </div>
              <div class="price">${money(i.price)}</div>
              <button class="btn btn-plain" data-remove="${esc(i.productId)}">${icon('delete')}</button>
            </div>`).join('')
          : '<p class="empty">Кошик порожній. Додайте товари з пошуку —<br>вони одразу з’являться у застосунку «Сільпо».</p>'}
        <a class="btn btn-blue btn-wide" style="text-decoration:none" href="https://silpo.ua/cart" target="_blank" rel="noreferrer">${icon('basket')}Оформити в «Сільпо»</a>
        ${cart.items.length ? `<button class="btn btn-plain btn-wide" id="clearCartBtn">${icon('delete')}Очистити кошик</button>` : ''}
        <div class="listline" style="margin-top:10px">
          <input id="promoInput" placeholder="Промокод">
          <button class="btn btn-ink" id="promoBtn">${icon('sale')}Застосувати</button>
        </div>
        ${cart.bonusAvailable ? `<button class="btn btn-plain btn-wide" id="bonusBtn">${icon('gift')}Списати ${money(cart.bonusAvailable)} балабонусів</button>` : ''}
        ${(guest?.certificates || []).slice(0, 3).map((c, i) => `
          <button class="card-btn" data-cert="${i}">${icon('star')}<div>Сертифікат ${esc(c.barcode || c.code || '')}<span>${c.value ? money(c.value) : 'додати в кошик'}</span></div></button>
        `).join('')}
        <div class="listline">
          <input id="npCity" placeholder="Місто для «Нової пошти»">
          <button class="btn btn-plain" id="npBtn">НП</button>
        </div>
        <div id="npBox"></div>`;

      sheetBody.querySelectorAll('[data-remove]').forEach((b) => {
        b.onclick = async () => {
          b.innerHTML = '…';
          const data = await api('/api/cart/remove', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ productId: b.dataset.remove })
          }).catch(() => null);
          if (data?.success) {
            cart = data.cart;
            renderCart();
            el('cartText').textContent = cartLabel();
          }
        };
      });
      if (el('clearCartBtn')) {
        el('clearCartBtn').onclick = async (e) => {
          e.currentTarget.innerHTML = '…';
          const data = await api('/api/cart/clear', { method: 'POST' }).catch(() => null);
          if (data?.success) { cart = data.cart; renderCart(); el('cartText').textContent = cartLabel(); }
        };
      }
      if (el('promoBtn')) {
        el('promoBtn').onclick = async () => {
          const code = el('promoInput').value.trim();
          if (!code) return;
          const data = await api('/api/cart/update', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ promoCode: code })
          }).catch(() => null);
          if (data?.success) { cart = data.cart; renderCart(); }
          else sheetBody.insertAdjacentHTML('afterbegin', `<div class="banner err">${esc(data?.error || 'Промокод не застосувався')}</div>`);
        };
      }
      if (el('bonusBtn')) {
        el('bonusBtn').onclick = async () => {
          const data = await api('/api/cart/update', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ bonusRequested: cart.bonusAvailable })
          }).catch(() => null);
          if (data?.success) { cart = data.cart; renderCart(); }
        };
      }
      sheetBody.querySelectorAll('[data-cert]').forEach((btn) => {
        btn.onclick = async () => {
          const cert = guest.certificates[Number(btn.dataset.cert)];
          const data = await api('/api/cart/certificates', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              certificatesToAdd: [{ barcode: cert.barcode, pincode: cert.pincode || cert.pin }]
            })
          }).catch(() => null);
          if (data?.success) { cart = data.cart; renderCart(); }
        };
      });
      if (el('npBtn')) {
        el('npBtn').onclick = async () => {
          const city = el('npCity').value.trim();
          if (!city) return;
          const box = el('npBox');
          box.innerHTML = '<p class="empty">Шукаю відділення…</p>';
          const data = await api('/api/novaposhta', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ city })
          }).catch(() => null);
          if (!data?.success) {
            box.innerHTML = `<div class="banner err">${esc(data?.error || 'Не знайдено')}</div>`;
            return;
          }
          box.innerHTML = data.offices.map((o, i) => `
            <button class="card-btn" data-np="${i}">${icon('pin')}<div>${esc(o.title)}<span>№${esc(o.number || '')} · ${esc(o.type || '')}</span></div></button>
          `).join('') || '<p class="empty">Відділень немає</p>';
          box.querySelectorAll('[data-np]').forEach((node) => {
            node.onclick = async () => {
              const office = data.offices[Number(node.dataset.np)];
              const applied = await api('/api/novaposhta/apply', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ office, settlement: data.settlement })
              }).catch(() => null);
              if (applied?.success) { cart = applied.cart; renderCart(); }
              else box.insertAdjacentHTML('afterbegin', `<div class="banner err">${esc(applied?.error || 'Не вдалося змінити доставку')}</div>`);
            };
          });
        };
      }
    }

    document.querySelectorAll('.tab').forEach((b) => { b.onclick = () => setTab(b.dataset.tab); });
    el('grabber').onclick = () => sheet.classList.toggle('collapsed');
    el('changeStoreBtn').onclick = () => { setTab('stores'); sheet.classList.remove('collapsed'); };
    el('cartChip').onclick = () => { setTab('cart'); sheet.classList.remove('collapsed'); };
    el('reloadBtn').onclick = boot;
    el('zoomIn').onclick = () => map.camera.position.multiplyScalar(0.85);
    el('zoomOut').onclick = () => map.camera.position.multiplyScalar(1.18);
    el('zoomReset').onclick = () => { map.clearRoute(); map.highlight(null); markDeptChip(null); map.frameAll(); };
    el('shuffleBtn').onclick = () => {
      if (!store) return;
      products = [];
      pickStore(store, `${store.id}-${Math.random().toString(36).slice(2, 8)}`);
    };

    let typing = null;
    mainInput.addEventListener('input', (e) => {
      if (tab !== 'stores') return;
      clearTimeout(typing);
      const value = e.target.value.trim();
      typing = setTimeout(() => loadStores(value), 250);
    });
    mainInput.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter') return;
      const value = e.target.value.trim();
      if (!value) return;
      if (tab === 'stores') {
        if (/[0-9]/.test(value) || value.split(/\s+/).length > 2) nearestFromQuery(value);
        else loadStores(value);
      }
      else searchProducts(value);
    });

    boot();
  </script>
</body>
</html>
