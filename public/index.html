<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FE860F">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="description" content="AI-навігатор по магазину Сільпо на офіційному MCP: 3D-схема залу, маршрут до товару та Цінотижики по дорозі.">
  <link rel="manifest" href="/manifest.webmanifest">
  <title>Сільпо Навігатор — маршрут до товару</title>
  <style>
    :root {
      --orange: #FE860F;
      --orange-dark: #DB5800;
      --yellow: #FFD939;
      --blue: #317DE9;
      --ink: #221812;
      --muted-fg: #6B5A4D;
      --cream: #FFF7EA;
      --muted: #F9F1E3;
      --secondary: #FBECD9;
      --border: #E6DCD0;
      --danger: #E60016;
      --card: #FFFFFF;
      --radius: 16px;
      --safe-b: env(safe-area-inset-bottom, 0px);
      --safe-t: env(safe-area-inset-top, 0px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; overscroll-behavior: none; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--cream); color: var(--ink); display: flex; flex-direction: column;
    }
    .hidden { display: none !important; }

    .side { display: flex; flex-direction: column; min-height: 0; }
    header {
      background: var(--card); border-bottom: 1px solid var(--border);
      padding: calc(10px + var(--safe-t)) 14px 10px; display: flex; align-items: center; gap: 8px;
    }
    .logo { font-weight: 800; font-size: 16px; letter-spacing: -0.3px; }
    .logo b { color: var(--orange); }
    .chip {
      background: var(--yellow); color: var(--ink); padding: 5px 10px;
      border-radius: 999px; font-size: 12px; font-weight: 700; white-space: nowrap;
    }
    .chip.cart { background: var(--orange); color: #fff; margin-left: auto; border: 0; }
    .icon-btn { background: var(--muted); border: 1px solid var(--border); color: var(--ink); width: 32px; height: 32px; border-radius: 999px; font-size: 14px; }

    .searchbar { background: var(--card); padding: 0 14px 12px; border-bottom: 1px solid var(--border); }
    .searchbar input {
      width: 100%; border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px;
      font-size: 16px; background: var(--muted); color: var(--ink);
    }
    .searchbar input:focus { outline: 2px solid var(--orange); background: #fff; }
    .storechip {
      display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 12px;
      color: var(--muted-fg); background: var(--secondary); padding: 8px 12px; border-radius: 12px;
    }
    .storechip strong { color: var(--ink); }
    .storechip button { margin-left: auto; background: var(--ink); color: #fff; border: 0; border-radius: 999px; padding: 5px 12px; font-size: 11px; font-weight: 700; }

    main { flex: 1; position: relative; min-height: 0; }
    canvas#map { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
    .map-hint {
      position: absolute; left: 12px; top: 12px; background: rgba(255,255,255,.94);
      border: 1px solid var(--border); border-radius: 12px; padding: 8px 12px;
      font-size: 12px; color: var(--muted-fg); max-width: 62%;
    }
    .zoom { position: absolute; right: 12px; top: 12px; display: flex; flex-direction: column; gap: 8px; }
    .zoom button { width: 38px; height: 38px; border-radius: 12px; border: 1px solid var(--border); background: #fff; font-size: 15px; }
    .mcp-badge {
      position: absolute; left: 12px; bottom: 12px; background: var(--ink); color: #fff;
      border-radius: 999px; padding: 6px 12px; font-size: 11px; font-weight: 600; opacity: .9;
    }

    .sheet {
      position: absolute; left: 0; right: 0; bottom: 0; background: var(--card);
      border-radius: 20px 20px 0 0; box-shadow: 0 -6px 24px rgba(34,24,18,.14);
      max-height: 74%; display: flex; flex-direction: column;
      padding-bottom: var(--safe-b); transition: transform .25s ease;
    }
    .sheet.collapsed { transform: translateY(calc(100% - 92px)); }
    .grabber { padding: 10px; display: flex; justify-content: center; }
    .grabber i { width: 42px; height: 4px; background: var(--border); border-radius: 999px; display: block; }
    .tabs { display: flex; gap: 6px; padding: 0 12px 10px; }
    .tab { flex: 1; border: 1px solid var(--border); background: var(--muted); color: var(--muted-fg); padding: 9px 4px; border-radius: 10px; font-size: 12px; font-weight: 700; }
    .tab.active { background: var(--ink); border-color: var(--ink); color: #fff; }
    .sheet-head { display: flex; align-items: baseline; gap: 8px; padding: 0 16px 10px; }
    .sheet-head h2 { font-size: 15px; font-weight: 800; }
    .sheet-head .count { color: var(--muted-fg); font-size: 12px; }
    .sheet-body { overflow: auto; padding: 0 12px 16px; -webkit-overflow-scrolling: touch; }

    .row { display: flex; gap: 10px; align-items: center; padding: 10px; border-radius: var(--radius); background: #fff; border: 1px solid var(--border); margin-bottom: 8px; }
    .row img { width: 52px; height: 52px; object-fit: contain; border-radius: 10px; background: var(--muted); }
    .row .info { flex: 1; min-width: 0; }
    .row .name { font-size: 13px; font-weight: 700; line-height: 1.3; }
    .row .sub { font-size: 11px; color: var(--muted-fg); margin-top: 4px; display: flex; gap: 5px; flex-wrap: wrap; align-items: center; }
    .pill { background: var(--muted); border: 1px solid var(--border); border-radius: 999px; padding: 2px 8px; font-size: 10px; color: var(--muted-fg); }
    .pill.promo { background: var(--yellow); border-color: var(--yellow); color: var(--ink); font-weight: 800; }
    .price { font-weight: 800; font-size: 14px; white-space: nowrap; text-align: right; }
    .price s { display: block; font-weight: 500; font-size: 10px; color: var(--muted-fg); }
    .acts { display: flex; flex-direction: column; gap: 6px; }
    .btn { border: 0; border-radius: 10px; padding: 9px 10px; font-size: 11px; font-weight: 800; min-width: 62px; }
    .btn-orange { background: var(--orange); color: #fff; }
    .btn-ink { background: var(--ink); color: #fff; }
    .btn-plain { background: var(--muted); color: var(--ink); border: 1px solid var(--border); }
    .btn-wide { width: 100%; padding: 13px; font-size: 14px; margin-top: 8px; }

    .promo-block { border: 1px dashed var(--orange); background: #FFFCF5; border-radius: var(--radius); padding: 10px; margin-bottom: 10px; }
    .promo-block h3 { font-size: 12px; font-weight: 800; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
    .promo-block h3 span { background: var(--yellow); border-radius: 999px; padding: 2px 8px; font-size: 10px; }
    .promo-row { display: flex; gap: 10px; align-items: center; padding: 8px; background: #fff; border: 1px solid var(--border); border-radius: 12px; margin-bottom: 6px; }
    .promo-row img { width: 42px; height: 42px; object-fit: contain; border-radius: 8px; background: var(--muted); }
    .promo-row .info { flex: 1; min-width: 0; }
    .promo-row .name { font-size: 12px; font-weight: 700; }
    .promo-row .meta { font-size: 10px; color: var(--muted-fg); margin-top: 3px; }
    .save { background: var(--danger); color: #fff; border-radius: 999px; padding: 2px 7px; font-size: 10px; font-weight: 800; }

    .store { padding: 12px; border-bottom: 1px solid var(--border); }
    .store:active { background: var(--muted); }
    .store .city { font-size: 13px; font-weight: 800; }
    .store .addr { font-size: 12px; color: var(--muted-fg); margin-top: 2px; }
    .store .flags { font-size: 10px; color: var(--muted-fg); margin-top: 4px; }

    .empty { text-align: center; color: var(--muted-fg); font-size: 12px; padding: 22px 12px; line-height: 1.5; }
    .banner { margin: 0 0 10px; padding: 12px; border-radius: 12px; font-size: 12px; line-height: 1.45; }
    .banner.warn { background: var(--secondary); color: var(--ink); }
    .banner.err { background: #FFECEE; color: var(--danger); }
    .banner.ok { background: #EAF7EE; color: #1C7A3E; }
    .listline { display: flex; gap: 8px; padding: 0 0 10px; }
    .listline input { flex: 1; border: 1px solid var(--border); border-radius: 12px; padding: 11px 12px; font-size: 14px; background: var(--muted); }
    .step { display: flex; gap: 10px; align-items: center; padding: 10px 12px; background: #fff; border: 1px solid var(--border); border-radius: 12px; margin-bottom: 6px; font-size: 12px; }
    .step b { width: 22px; height: 22px; border-radius: 999px; background: var(--orange); color: #fff; font-size: 11px; display: grid; place-items: center; flex: none; }
    .total { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: var(--secondary); border-radius: 12px; font-size: 13px; font-weight: 800; margin-bottom: 8px; }

    @media (min-width: 900px) {
      body { flex-direction: row; }
      .side { width: 420px; background: var(--card); border-right: 1px solid var(--border); }
      .sheet { position: static; max-height: none; flex: 1; box-shadow: none; border-radius: 0; transform: none !important; }
      .grabber { display: none; }
      main { flex: 1; }
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div class="side">
    <header>
      <div class="logo">Сільпо <b>Навігатор</b></div>
      <div class="chip hidden" id="bonusChip"></div>
      <button class="chip cart hidden" id="cartChip">Кошик</button>
      <button class="icon-btn" id="reloadBtn" title="Оновити">⟳</button>
    </header>

    <div class="searchbar">
      <input id="mainInput" type="search" placeholder="Знайти товар у магазині" enterkeyhint="search">
      <div class="storechip">
        <span id="storeChipText">Магазин не обрано</span>
        <button id="changeStoreBtn">Змінити</button>
      </div>
    </div>

    <section class="sheet" id="sheet">
      <div class="grabber" id="grabber"><i></i></div>
      <div class="tabs">
        <button class="tab active" data-tab="products">Товари</button>
        <button class="tab" data-tab="list">Список</button>
        <button class="tab" data-tab="stores">Магазини</button>
        <button class="tab" data-tab="cart">Кошик</button>
      </div>
      <div class="sheet-head">
        <h2 id="sheetTitle">Пошук товарів</h2>
        <span class="count" id="sheetCount"></span>
      </div>
      <div class="sheet-body" id="sheetBody"></div>
    </section>
  </div>

  <main>
    <canvas id="map"></canvas>
    <div class="map-hint" id="mapHint">Оберіть магазин, щоб побудувати 3D-схему залу</div>
    <div class="zoom">
      <button id="zoomIn">＋</button>
      <button id="zoomOut">－</button>
      <button id="zoomReset">⤢</button>
      <button id="shuffleBtn" title="Інша планіровка">🎲</button>
    </div>
    <div class="mcp-badge" id="mcpBadge">MCP «Сільпо»</div>
  </main>

  <script type="module">
    import { StoreMap3D } from './js/store3d.js';

    const el = (id) => document.getElementById(id);
    const map = new StoreMap3D(el('map'));
    const sheet = el('sheet');
    const sheetBody = el('sheetBody');
    const sheetTitle = el('sheetTitle');
    const sheetCount = el('sheetCount');
    const mainInput = el('mainInput');
    const mapHint = el('mapHint');

    let tab = 'products';
    let store = null;
    let stores = [];
    let layout = null;
    let seed = null;
    let products = [];
    let promos = { title: '', suggestions: [] };
    let shoppingList = [];
    let cart = null;

    const esc = (v) => String(v ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const money = (v) => (v == null ? '' : `${Number(v).toFixed(2).replace('.00', '')} ₴`);

    async function api(url, options) {
      const res = await fetch(url, options);
      const data = await res.json().catch(() => ({ success: false, error: 'Сервер не відповів' }));
      if (data.needsAuth) {
        renderAuth(data.authUrl);
        throw new Error('needs_auth');
      }
      return data;
    }

    function setTab(next) {
      tab = next;
      document.querySelectorAll('.tab').forEach((b) => b.classList.toggle('active', b.dataset.tab === next));
      mainInput.placeholder = next === 'stores' ? 'Місто або вулиця магазину' : 'Знайти товар у магазині';
      render();
    }

    function render() {
      if (tab === 'stores') return renderStores();
      if (tab === 'list') return renderList();
      if (tab === 'cart') return renderCart();
      renderProducts();
    }

    async function boot() {
      const status = await fetch('/api/mcp/status').then((r) => r.json()).catch(() => ({}));
      if (!status.connected) return renderAuth(status.authUrl);

      el('mcpBadge').textContent = `MCP «Сільпо» · ${status.toolsCount} tools · ${status.usedTools} у роботі`;
      loadMe();
      loadCart();
      await loadStores();

      const saved = JSON.parse(localStorage.getItem('silpo.store') || 'null');
      if (saved?.id) await pickStore(saved);
      else setTab('stores');
    }

    function renderAuth(authUrl) {
      setTab('products');
      sheetTitle.textContent = 'Вхід у Сільпо';
      sheetCount.textContent = '';
      sheetBody.innerHTML = `
        <div class="banner warn">Навігатор працює від імені гостя через офіційний MCP «Сільпо»: магазини, категорії, товари, акції та кошик — реальні. Увійдіть у свій акаунт, щоб почати.</div>
        <button class="btn btn-orange btn-wide" id="loginBtn">Увійти через Сільпо</button>
        <button class="btn btn-plain btn-wide" id="recheckBtn">Я вже увійшов — перевірити</button>`;

      el('loginBtn').onclick = async () => {
        const data = authUrl ? { authUrl } : await fetch('/api/mcp/auth', { method: 'POST' }).then((r) => r.json());
        if (data.authUrl) window.open(data.authUrl, '_blank', 'noopener');
        el('loginBtn').textContent = 'Очікую підтвердження…';
        const timer = setInterval(async () => {
          const st = await fetch('/api/mcp/status').then((r) => r.json()).catch(() => ({}));
          if (st.connected) {
            clearInterval(timer);
            boot();
          }
        }, 2500);
      };
      el('recheckBtn').onclick = boot;
    }

    async function loadMe() {
      const data = await fetch('/api/me').then((r) => r.json()).catch(() => ({}));
      const bonus = data?.loyalty?.loyalty?.bonusTotal ?? data?.loyalty?.bonusTotal;
      if (bonus != null) {
        el('bonusChip').classList.remove('hidden');
        el('bonusChip').textContent = `${Number(bonus).toFixed(2)} балабонусів`;
      }
    }

    async function loadCart() {
      const data = await api('/api/cart').catch(() => null);
      if (!data?.success) return;
      cart = data.cart;
      const chip = el('cartChip');
      chip.classList.remove('hidden');
      chip.textContent = cart.count ? `Кошик · ${cart.count} · ${money(cart.total)}` : 'Кошик порожній';
      if (tab === 'cart') renderCart();
    }

    async function loadStores(q = '') {
      const data = await api(`/api/stores?q=${encodeURIComponent(q)}`).catch(() => null);
      if (!data?.success) return;
      stores = data.stores;
      if (tab === 'stores') renderStores();
      else sheetCount.textContent = '';
    }

    function renderStores() {
      sheetTitle.textContent = 'Магазини «Сільпо»';
      sheetCount.textContent = `${stores.length} знайдено`;
      if (!stores.length) {
        sheetBody.innerHTML = '<p class="empty">Нічого не знайдено. Спробуйте іншу вулицю або місто.</p>';
        return;
      }
      sheetBody.innerHTML = stores.slice(0, 120).map((s, i) => `
        <div class="store" data-i="${i}">
          <div class="city">${esc(s.city || 'Магазин')}</div>
          <div class="addr">${esc(s.address)}</div>
          <div class="flags">${s.open ? 'Працює' : 'Закритий'}${s.hasPickup ? ' · самовивіз' : ''}</div>
        </div>`).join('');
      sheetBody.querySelectorAll('.store').forEach((node) => {
        node.onclick = () => pickStore(stores[Number(node.dataset.i)]);
      });
    }

    async function pickStore(next, newSeed) {
      store = next;
      seed = newSeed || store.id;
      localStorage.setItem('silpo.store', JSON.stringify(next));
      el('storeChipText').innerHTML = `<strong>${esc(next.city)}</strong>, ${esc(next.address)}`;
      mapHint.textContent = 'Генерую планіровку залу та розставляю відділи з MCP…';
      if (!newSeed) setTab('products');
      sheetBody.innerHTML = '<p class="empty">Завантажую відділи магазину…</p>';

      const data = await api(
        `/api/layout?branchId=${encodeURIComponent(next.id)}&seed=${encodeURIComponent(seed)}`
      ).catch(() => null);
      if (!data) return;
      if (!data.success) {
        mapHint.textContent = 'Не вдалося отримати категорії магазину';
        sheetBody.innerHTML = `<div class="banner err">${esc(data.error)}</div>`;
        return;
      }

      layout = data.layout;
      promos = { title: '', suggestions: [] };
      map.loadLayout(layout);
      map.onShelfTap = (id) => {
        const shelf = layout.shelves.find((s) => s.id === id);
        if (!shelf) return;
        map.highlight(id);
        map.showRoute(routeTo(shelf));
        mapHint.textContent = `${shelf.name} · ${shelf.total} товарів у категорії`;
      };
      mapHint.textContent = `${layout.shelves.length} відділів · зал ${layout.floor.width}×${layout.floor.depth} м`;
      if (tab === 'products') renderProducts();
    }

    function routeTo(shelf) {
      return [
        { x: layout.entrance.x, z: layout.entrance.z },
        { x: layout.entrance.x, z: layout.frontAisleZ },
        ...shelf.path
      ];
    }

    async function searchProducts(query) {
      if (!store) { setTab('stores'); return; }
      setTab('products');
      sheetTitle.textContent = `«${query}»`;
      sheetBody.innerHTML = '<p class="empty">Шукаю в каталозі магазину…</p>';

      const data = await api('/api/search', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ branchId: store.id, query, seed })
      }).catch(() => null);

      if (!data) return;
      if (!data.success) {
        sheetBody.innerHTML = `<div class="banner err">${esc(data.error)}</div>`;
        return;
      }

      products = data.products;
      promos = { title: '', suggestions: [] };
      sheetCount.textContent = `${data.totalFound} у магазині`;
      renderProducts();
      if (products[0]) focusProduct(products[0]);
    }

    function productRow(p, index) {
      return `
        <div class="row">
          ${p.image ? `<img src="${esc(p.image)}" alt="" loading="lazy">` : ''}
          <div class="info">
            <div class="name">${esc(p.name)}</div>
            <div class="sub">
              ${p.displayRatio ? `<span class="pill">${esc(p.displayRatio)}</span>` : ''}
              ${p.shelfName ? `<span class="pill">${esc(p.shelfName)}</span>` : ''}
              ${p.hasPromotion ? '<span class="pill promo">Акція</span>' : ''}
            </div>
          </div>
          <div class="price">${money(p.price)}${p.oldPrice ? `<s>${money(p.oldPrice)}</s>` : ''}</div>
          <div class="acts">
            <button class="btn btn-ink" data-go="${index}">Шлях</button>
            <button class="btn btn-orange" data-cart="${index}">+ кошик</button>
          </div>
        </div>`;
    }

    function renderProducts() {
      if (tab !== 'products') return;
      if (!store) {
        sheetBody.innerHTML = '<p class="empty">Спершу оберіть магазин на вкладці «Магазини».</p>';
        return;
      }
      if (!products.length) {
        sheetBody.innerHTML = '<p class="empty">Введіть назву товару — покажу стелаж, шлях від входу<br>і Цінотижики, що трапляться по дорозі.</p>';
        return;
      }

      sheetBody.innerHTML = promoBlock() + products.map(productRow).join('');
      bindProductActions();
    }

    function promoBlock() {
      if (!promos.suggestions.length) return '';
      return `
        <div class="promo-block">
          <h3>По дорозі <span>${esc(promos.title)}</span></h3>
          ${promos.suggestions.map((s, i) => `
            <div class="promo-row">
              ${s.product.image ? `<img src="${esc(s.product.image)}" alt="" loading="lazy">` : ''}
              <div class="info">
                <div class="name">${esc(s.product.name)}</div>
                <div class="meta">${esc(s.shelfName)} · ${s.detourMeters < 1.5 ? 'просто по дорозі' : `+${s.detourMeters} м вбік`}</div>
              </div>
              <div class="price">${money(s.product.price)}<s>${money(s.product.oldPrice)}</s></div>
              <div class="acts">
                <span class="save">−${s.discountPercent}%</span>
                <button class="btn btn-orange" data-promo-cart="${i}">+ кошик</button>
              </div>
            </div>`).join('')}
        </div>`;
    }

    function bindProductActions() {
      sheetBody.querySelectorAll('[data-go]').forEach((b) => {
        b.onclick = () => focusProduct(products[Number(b.dataset.go)]);
      });
      sheetBody.querySelectorAll('[data-cart]').forEach((b) => {
        b.onclick = () => addToCart(products[Number(b.dataset.cart)], b);
      });
      sheetBody.querySelectorAll('[data-promo-cart]').forEach((b) => {
        b.onclick = () => addToCart(promos.suggestions[Number(b.dataset.promoCart)].product, b);
      });
    }

    async function addToCart(product, button) {
      if (!product || !store) return;
      const label = button.textContent;
      button.textContent = '…';
      const data = await api('/api/cart/add', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          branchId: product.branchId || store.id,
          productId: product.id,
          companyId: product.companyId,
          quantity: 1
        })
      }).catch(() => null);

      if (!data?.success) {
        button.textContent = 'помилка';
        setTimeout(() => { button.textContent = label; }, 2000);
        if (data?.error) alert(data.error);
        return;
      }

      cart = data.cart;
      button.textContent = '✓ додано';
      el('cartChip').textContent = `Кошик · ${cart.count} · ${money(cart.total)}`;
      setTimeout(() => { button.textContent = label; }, 2000);
    }

    async function focusProduct(p) {
      if (!p?.route || p.route.length < 2) return;
      map.highlight(p.shelfId);
      map.showRoute(p.route);
      mapHint.textContent = `${p.name} → ${p.shelfName || 'стелаж'}`;
      if (window.innerWidth < 900) sheet.classList.add('collapsed');
      await loadOnTheWay(p.route, [p.shelfId]);
    }

    async function loadOnTheWay(route, skipShelfIds) {
      if (!store) return;
      const data = await api('/api/on-the-way', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ branchId: store.id, seed, route, skipShelfIds })
      }).catch(() => null);

      if (!data?.success || !data.suggestions.length) return;
      promos = { title: data.promoTitle, suggestions: data.suggestions };
      if (tab === 'products') renderProducts();
    }

    function renderList() {
      sheetTitle.textContent = 'Список покупок';
      sheetCount.textContent = shoppingList.length ? `${shoppingList.length} товарів` : '';
      const items = shoppingList.length
        ? shoppingList.map((p, i) => `
          <div class="row">
            ${p.image ? `<img src="${esc(p.image)}" alt="" loading="lazy">` : ''}
            <div class="info">
              <div class="name">${esc(p.name)}</div>
              <div class="sub">${p.shelfName ? `<span class="pill">${esc(p.shelfName)}</span>` : ''}</div>
            </div>
            <div class="price">${money(p.price)}</div>
            <button class="btn btn-plain" data-del="${i}">✕</button>
          </div>`).join('')
        : '<p class="empty">Введіть список через кому — прокладу маршрут через усі відділи до кас<br>і додам знайдене в кошик Сільпо.</p>';

      sheetBody.innerHTML = `
        <div class="listline">
          <input id="bulkInput" placeholder="молоко, хліб, банани, кава">
          <button class="btn btn-ink" id="bulkBtn">Маршрут</button>
        </div>
        ${items}
        ${shoppingList.length ? '<button class="btn btn-orange btn-wide" id="listToCartBtn">Додати весь список у кошик</button>' : ''}`;

      el('bulkBtn').onclick = () => bulkRoute(el('bulkInput').value);
      el('bulkInput').onkeydown = (e) => { if (e.key === 'Enter') bulkRoute(e.target.value); };
      sheetBody.querySelectorAll('[data-del]').forEach((b) => {
        b.onclick = () => { shoppingList.splice(Number(b.dataset.del), 1); renderList(); };
      });
      if (el('listToCartBtn')) el('listToCartBtn').onclick = (e) => addListToCart(e.target);
    }

    async function bulkRoute(raw) {
      const items = String(raw || '').split(/[,;\n]/).map((s) => s.trim()).filter(Boolean);
      if (!store || !items.length) return;
      setTab('list');
      sheetBody.innerHTML = '<p class="empty">Складаю маршрут по відділах…</p>';

      const data = await api('/api/list-search', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ branchId: store.id, items, seed })
      }).catch(() => null);

      if (!data) return;
      if (!data.success) {
        sheetBody.innerHTML = `<div class="banner err">${esc(data.error)}</div>`;
        return;
      }

      shoppingList = data.results.map((r) => r.best).filter(Boolean);
      map.showRoute(data.route);
      map.highlight(null);
      sheetTitle.textContent = 'Маршрут по списку';
      sheetCount.textContent = `${data.order.length} відділів`;
      mapHint.textContent = `Вхід → ${data.order.length} відділів → каси`;

      const missing = data.results.filter((r) => !r.best).map((r) => r.query);
      sheetBody.innerHTML =
        data.order.map((s, i) => `<div class="step"><b>${i + 1}</b><span>${esc(s.name)}</span></div>`).join('') +
        (missing.length ? `<div class="banner warn">Не знайшли в цьому магазині: ${esc(missing.join(', '))}</div>` : '') +
        shoppingList.map(productRow).join('') +
        '<button class="btn btn-orange btn-wide" id="listToCartBtn">Додати весь список у кошик</button>';

      bindProductActions();
      el('listToCartBtn').onclick = (e) => addListToCart(e.target);
    }

    async function addListToCart(button) {
      button.textContent = 'Додаю…';
      for (const product of shoppingList) {
        await api('/api/cart/add', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            branchId: product.branchId || store.id,
            productId: product.id,
            companyId: product.companyId,
            quantity: 1
          })
        }).catch(() => null);
      }
      await loadCart();
      button.textContent = `✓ у кошику · ${money(cart?.total)}`;
    }

    async function renderCart() {
      sheetTitle.textContent = 'Кошик «Сільпо»';
      if (!cart) {
        sheetBody.innerHTML = '<p class="empty">Завантажую кошик…</p>';
        await loadCart();
        if (!cart) return;
      }
      sheetCount.textContent = cart.count ? `${cart.count} шт` : 'порожній';
      sheetBody.innerHTML = `
        <div class="total"><span>До сплати</span><span>${money(cart.total)}</span></div>
        ${cart.discount ? `<div class="banner ok">Знижка в кошику: ${money(cart.discount)}</div>` : ''}
        ${cart.bonusTotal != null ? `<div class="banner warn">Балабонуси: ${money(cart.bonusTotal)} · доступно зараз ${money(cart.bonusAvailable)}</div>` : ''}
        ${cart.items.length
          ? cart.items.map((i) => `
            <div class="row">
              <div class="info">
                <div class="name">${esc(i.name)}</div>
                <div class="sub"><span class="pill">${i.quantity} шт</span></div>
              </div>
              <div class="price">${money(i.price)}</div>
              <button class="btn btn-plain" data-remove="${esc(i.productId)}">✕</button>
            </div>`).join('')
          : '<p class="empty">Кошик порожній. Додайте товари з пошуку — вони одразу з’являться у застосунку «Сільпо».</p>'}
        <a class="btn btn-orange btn-wide" style="display:block;text-align:center;text-decoration:none" href="https://silpo.ua/cart" target="_blank" rel="noreferrer">Оформити в «Сільпо»</a>`;

      sheetBody.querySelectorAll('[data-remove]').forEach((b) => {
        b.onclick = async () => {
          b.textContent = '…';
          const data = await api('/api/cart/remove', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ productId: b.dataset.remove })
          }).catch(() => null);
          if (data?.success) {
            cart = data.cart;
            renderCart();
            el('cartChip').textContent = cart.count ? `Кошик · ${cart.count} · ${money(cart.total)}` : 'Кошик порожній';
          }
        };
      });
    }

    document.querySelectorAll('.tab').forEach((b) => { b.onclick = () => setTab(b.dataset.tab); });
    el('grabber').onclick = () => sheet.classList.toggle('collapsed');
    el('changeStoreBtn').onclick = () => { setTab('stores'); sheet.classList.remove('collapsed'); };
    el('cartChip').onclick = () => { setTab('cart'); sheet.classList.remove('collapsed'); };
    el('reloadBtn').onclick = boot;
    el('zoomIn').onclick = () => map.camera.position.multiplyScalar(0.85);
    el('zoomOut').onclick = () => map.camera.position.multiplyScalar(1.18);
    el('zoomReset').onclick = () => { map.clearRoute(); map.highlight(null); map.frameAll(); };
    el('shuffleBtn').onclick = () => {
      if (!store) return;
      products = [];
      pickStore(store, `${store.id}-${Math.random().toString(36).slice(2, 8)}`);
    };

    let typing = null;
    mainInput.addEventListener('input', (e) => {
      if (tab !== 'stores') return;
      clearTimeout(typing);
      const value = e.target.value.trim();
      typing = setTimeout(() => loadStores(value), 250);
    });
    mainInput.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter') return;
      const value = e.target.value.trim();
      if (!value) return;
      if (tab === 'stores') loadStores(value);
      else searchProducts(value);
    });

    boot();
  </script>
</body>
</html>
