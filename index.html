<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Навігатор Сільпо — Воскресенський просп., 36</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<div class="container">
  <header>
    <h1>🛒 Навігатор <span>Сільпо</span></h1>
    <div class="address">📍 Воскресенський просп., 36, Київ</div>
  </header>

  <!-- Пошук -->
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Що шукаєте? Наприклад: молоко, хліб, ковбаса..." />
    <button id="searchBtn">🔍 Знайти на карті</button>
  </div>

  <!-- Карта магазину -->
  <div class="store-map" id="storeMap">
    <div class="map-grid" id="mapGrid">
      <!-- Зони будуть вставлені JS -->
    </div>
    <div class="entry-exit">
      <div class="entry">🚪 ВХІД</div>
      <div class="exit">🛒 КАСИ / ВИХІД</div>
    </div>
  </div>

  <!-- Стрілки маршруту -->
  <div class="route-container" id="routeContainer">
    <div class="route-steps" id="routeSteps"></div>
    <div class="route-info" id="routeInfo"></div>
  </div>

  <!-- Результат пошуку з MCP -->
  <div class="result-box" id="resultBox">
    <div id="resultContent"></div>
  </div>

  <!-- Футер -->
  <div class="footer">
    🧠 Працює на базі офіційного MCP «Сільпо» · AI Factory Hackathon 2026
  </div>
</div>

<script src="/js/app.js"></script>
</body>
</html>
